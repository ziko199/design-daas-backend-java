# ArchUnit + Surefire 3.5.x + JUnit Platform 1.12.x compatibility
#
# Surefire 3.3+ registers a LauncherInterceptor which can shadow custom test engines
# (e.g. ArchUnit's ArchUnitTestEngine) under JUnit Platform 1.12.x.
# Disabling the interceptor restores ArchUnit's engine discovery so that
# static @ArchTest fields in @AnalyzeClasses-annotated classes are reported as tests.
junit.platform.launcher.interceptors.enabled=false

